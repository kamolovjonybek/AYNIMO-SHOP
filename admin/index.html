<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>AYNIMO — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Bodoni+Moda:opsz,wght@6..96,500&display=swap">
<style>
:root{--bg:#f3f3f1;--card:#fff;--ink:#16171a;--ink2:#5d6068;--ink3:#9a9da4;--line:#e2e2df;--acc:#16171a;--ok:#2f7d4f;--warn:#b7791f;--bad:#c2463a;--blue:#2c5fa8;
  --sans:"Jost",system-ui,sans-serif;--display:"Bodoni Moda",Georgia,serif;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
.top{position:sticky;top:0;z-index:20;background:rgba(243,243,241,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;height:64px;padding-bottom:0}
.logo{font-weight:500;letter-spacing:.32em;font-size:15px}.logo small{letter-spacing:.1em;color:var(--ink3);font-size:11px;margin-left:6px}
nav.tabs{display:flex;gap:4px;flex:1;overflow-x:auto}
nav.tabs button{height:36px;padding:0 14px;border-radius:18px;color:var(--ink2);white-space:nowrap}
nav.tabs button.on{background:var(--ink);color:#fff}
nav.tabs .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;margin-left:6px}
.me{font-size:12px;color:var(--ink2);display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:6px;background:var(--ink);color:#fff;font-weight:500;font-size:14px;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:var(--bad)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
h1{font-family:var(--display);font-weight:500;font-size:clamp(28px,4vw,40px);line-height:1.1}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:28px 0 18px}
.sub{color:var(--ink2);font-size:14px;margin-top:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],input[type=email],input[type=password],input[type=number],input[type=tel],input[type=date],input[type=datetime-local],select,textarea{height:40px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%;min-width:0}
textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
label.f{display:grid;gap:6px;font-size:12px;color:var(--ink2)}
label.f>span{font-weight:500;color:var(--ink)}
label.f small{color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.muted{color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;z-index:100;transition:transform .35s;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0)}.toast.err{background:var(--bad)}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .card{width:min(400px,100%);padding:32px;display:grid;gap:14px}
.login h1{font-size:32px}
.login .err{color:var(--bad);font-size:13px}
/* orders */
.olist{display:grid;gap:12px}
.order{padding:16px 18px;display:grid;gap:12px}
.order .row1{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
.order .no{font-weight:600;font-size:16px}
.order .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2)}
.order .meta b{color:var(--ink);font-weight:500}
.order .items{display:grid;gap:8px}
.order .it{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;font-size:13px}
.order .it img{width:44px;height:56px;object-fit:cover;border-radius:4px;background:var(--bg)}
.order .it .q{color:var(--ink2)}
.order .tot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;font-weight:600}
.order .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.order .acts select{width:auto}
.order .note{font-size:13px;background:#faf7ee;border-radius:6px;padding:8px 10px}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500}
.p-unpaid{background:#eee;color:var(--ink3)}.p-checking{background:#fdf3e1;color:var(--warn)}.p-paid{background:#e6f3eb;color:var(--ok)}.p-refunded{background:#fdecea;color:var(--bad)}
.s-new{background:#fdecea;color:var(--bad)}.s-confirmed{background:#e8f0fb;color:var(--blue)}.s-shipped{background:#fdf3e1;color:var(--warn)}.s-done{background:#e6f3eb;color:var(--ok)}.s-cancelled{background:#eee;color:var(--ink3)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stat{padding:14px 16px}.stat b{display:block;font-size:22px;font-weight:600}.stat span{font-size:12px;color:var(--ink2)}
/* products */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pc{overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .2s}
.pc:hover{box-shadow:0 6px 24px rgba(0,0,0,.08)}
.pc .ph{aspect-ratio:3/4;background:var(--bg);position:relative}
.pc .ph img{width:100%;height:100%;object-fit:cover}
.pc .ph .tag{position:absolute;left:8px;top:8px}
.pc .in{padding:10px 12px;display:grid;gap:2px}
.pc .in b{font-weight:500}
.pc .in small{color:var(--ink2);font-size:12px}
.pc.off{opacity:.55}
.dots{display:flex;gap:4px;margin-top:4px}.dots i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
/* editor */
.ed{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(20,21,24,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.ed.on{opacity:1;pointer-events:auto}
.ed .sheet{width:min(820px,100%);height:100%;background:var(--bg);overflow:auto;transform:translateX(30px);transition:transform .3s;display:flex;flex-direction:column}
.ed.on .sheet{transform:none}
.ed .bar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.ed .bar h2{font-family:var(--display);font-weight:500;font-size:24px}
.ed .body{padding:20px;display:grid;gap:18px}
.ed .body>*,.sec>*,.g2>*,.g3>*{min-width:0}.sec input,.sec select,.sec textarea{max-width:100%;min-width:0}
.stk td code{white-space:nowrap}
.sec{padding:18px;display:grid;gap:14px}
.sec h3{font-size:14px;font-weight:600;letter-spacing:.02em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border:1px solid var(--line);border-radius:15px;background:#fff;font-size:13px}
.chip button{width:22px;height:22px;border-radius:50%;color:var(--ink3)}.chip button:hover{background:var(--bg);color:var(--bad)}
.presets{display:flex;flex-wrap:wrap;gap:6px}.presets button{font-size:12px;height:28px;padding:0 10px;border:1px dashed var(--line);border-radius:14px;color:var(--ink2)}
.sw{display:flex;align-items:center;gap:10px}
.var{padding:14px;display:grid;gap:12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.var .vh{display:grid;grid-template-columns:1fr 120px auto;gap:10px;align-items:end}
.var input[type=color]{width:100%;height:40px;padding:2px;border:1px solid var(--line);border-radius:6px;background:#fff}
.imgs{display:flex;flex-wrap:wrap;gap:8px}
.im{position:relative;width:84px;height:112px;border-radius:6px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.im img{width:100%;height:100%;object-fit:cover}
.im .ctl{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;background:rgba(0,0,0,.55)}
.im .ctl button{color:#fff;width:28px;height:24px;font-size:13px}
.im .main{position:absolute;left:4px;top:4px;font-size:10px;background:#fff;border-radius:4px;padding:1px 5px}
.up{width:84px;height:112px;border:1px dashed var(--ink3);border-radius:6px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--ink2);cursor:pointer;padding:6px}
.up:hover{border-color:var(--ink);color:var(--ink)}
.rail{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}
.rail .rp{width:120px;height:120px;border-radius:6px;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/16px 16px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.rail .rp img{max-width:100%;max-height:100%}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.switch input{appearance:none;width:40px;height:24px;border-radius:12px;background:#cfd0d3;position:relative;transition:background .2s;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.switch input:checked{background:var(--ok)}.switch input:checked::after{left:19px}
.hint{font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.danger-zone{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--bad)}
.empty{padding:40px;text-align:center;color:var(--ink2)}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:720px){
  .top .wrap{gap:10px;height:auto;flex-wrap:wrap;padding-block:10px}
  nav.tabs{order:3;flex-basis:100%}
  .g2,.g3{grid-template-columns:1fr}
  .var .vh{grid-template-columns:1fr 90px}
  .var .vh .btn{grid-column:1/-1}
  .pgrid{grid-template-columns:repeat(2,1fr)}
  .rail{grid-template-columns:1fr}
}
.stk{border-collapse:collapse;font-size:13px;min-width:100%}.stk th,.stk td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.stk th{font-weight:500;color:var(--ink3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.stk input[type=number]{width:72px;padding:6px 8px}.stk.cat input[type=text]{min-width:120px;padding:6px 8px}.stk.cat input[type=date]{padding:6px 8px}
.pc .bad,small.bad{color:#b4472f}
</style>
</head>
<body>
<div id="app"><div class="login"><span class="spin"></span></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../vendor/supabase.min.js"></script>
<script>
(function(){
"use strict";
const SB_URL="https://woxpyneklstqcleipcxt.supabase.co",SB_KEY="sb_publishable_Inf-7Obvi8r-DY-lDaSwJQ_6fPbKOtE";
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt=s=>{const d=new Date(s),z=n=>String(n).padStart(2,"0");return `${z(d.getDate())}.${z(d.getMonth()+1)}.${d.getFullYear()} · ${z(d.getHours())}:${z(d.getMinutes())}`};
const fmt=n=>(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ")+" so'm";
const src=u=>!u?"":/^(https?:|data:|blob:)/.test(u)?u:"../"+u.replace(/^\/+/,"");
let CATN={};let cats=[],cols=[],isOwner=false;
const ERRN={stock_restore:"Bu buyurtmani qayta tiklab bo'lmaydi: mahsulot boshqa mijozga sotilib bo'lgan",last_owner:"Oxirgi egani o'chirib yoki pasaytirib bo'lmaydi",products_category_fk:"Bu bo'limda mahsulotlar bor — avval ularni boshqa bo'limga o'tkazing",products_sale_price_chk:"Chegirma narxi asl narxdan kichik bo'lishi kerak",categories_id_check:"Kod faqat kichik lotin harf, raqam, - va _",collections_id_check:"Kod faqat kichik lotin harf, raqam, - va _",duplicate:"Bu kod band"};
const STN={new:"Yangi",confirmed:"Tasdiqlandi",shipped:"Yo'lda",done:"Yakunlandi",cancelled:"Bekor qilindi"};
const PAYN={cash:"Naqd",card_courier:"Kuryerga karta",transfer:"O'tkazma",payme:"Payme",click:"Click",uzum:"Uzum"};
const PSN={unpaid:"To'lanmagan",checking:"Chek tekshirilmoqda",paid:"To'langan",refunded:"Qaytarilgan"};
const RSN={pending:"Kutmoqda",published:"Saytda",hidden:"Yashirin"};
const SIZES={"Kiyim":["M","L","XL","2XL","3XL"],"Kostyum":["46","48","50","52","54","56"],"Shim":["30","31","32","33","34","36"],"Oyoq kiyim":["39","40","41","42","43","44"],"Standart":["Standart"]};
const PROMPT={outer:"Substitute the current outer layer with a {color} jacket, worn open over the existing top, true-to-life fabric texture and fit",
  classic:"Substitute the current outer layer with a {color} tailored blazer, worn open over the existing top, true-to-life fabric texture and fit",
  knit:"Substitute the current top with a {color} knit sweater, regular fit, true-to-life knit texture",
  shirt:"Substitute the current top with a {color} button-up shirt, regular fit, true-to-life fabric texture",
  pants:"Substitute the current trousers with {color} trousers, tailored straight fit, true-to-life fabric texture",
  shoes:"Substitute the current shoes with {color} shoes, clean minimal design",
  acc:"Add a {color} knitted beanie hat on the head"};
let tT;const toast=(m,err)=>{const t=$("#toast");t.textContent=m;t.classList.toggle("err",!!err);t.classList.add("on");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("on"),3200)};
const fail=(e,what)=>{console.error(what,e);const m=String(e&&e.message||e);const k=Object.keys(ERRN).find(k=>m.includes(k))||(e&&e.code==="23505"?"duplicate":null);toast((what?what+": ":"")+(k?ERRN[k]:m),true)};
async function loadCats(){const [a,b]=await Promise.all([sb.from("categories").select("*").order("sort").order("id"),sb.from("collections").select("*").order("sort").order("id")]);if(a.error)throw a.error;if(b.error)throw b.error;cats=a.data;cols=b.data;CATN=Object.fromEntries(cats.map(c=>[c.id,c.name]))}
const catOpts=sel=>cats.map(c=>`<option value="${esc(c.id)}" ${c.id===sel?"selected":""}>${esc(c.name)}${c.active?"":" (yashirin)"}</option>`).join("");
let me=null,tab="orders",products=[],orders=[],settings={},lastNew=0;

/* ================= auth ================= */
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(location.hash.includes("type=recovery")) return showReset();
  if(!session) return showLogin();
  me=session.user;
  const {data:isA,error}=await sb.rpc("aynimo_is_admin");
  if(error||!isA) return showLogin(`${esc(me.email)} admin emas. Boshqa hisob bilan kiring.`,true);
  const ow=await sb.rpc("aynimo_is_owner");isOwner=!ow.error&&!!ow.data;
  try{await loadCats()}catch(e){fail(e,"Bo'limlar")}
  shell();
}
sb.auth.onAuthStateChange((ev)=>{if(ev==="PASSWORD_RECOVERY")showReset()});
function showLogin(msg,signedIn){
  $("#app").innerHTML=`<div class="login"><form class="card" id="lf"><div><div class="logo">AYNIMO <small>ADMIN</small></div><h1 style="margin-top:14px">Kirish</h1><p class="sub">Do'kon boshqaruv paneli</p></div>
   <label class="f"><span>Email</span><input type="email" id="le" autocomplete="username" required></label>
   <label class="f"><span>Parol</span><input type="password" id="lp" autocomplete="current-password" required></label>
   <div class="err" id="lerr">${msg||""}</div>
   <button class="btn" id="lb">Kirish</button>
   <button type="button" class="btn ghost" id="lr">Parolni unutdim</button>
   ${signedIn?`<button type="button" class="btn ghost" id="lo">Chiqish</button>`:""}</form></div>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();$("#lb").disabled=true;$("#lerr").textContent="";
    const {error}=await sb.auth.signInWithPassword({email:$("#le").value.trim(),password:$("#lp").value});
    $("#lb").disabled=false;if(error){$("#lerr").textContent=error.message==="Invalid login credentials"?"Email yoki parol noto'g'ri":error.message;return}init()};
  $("#lr").onclick=async()=>{const em=$("#le").value.trim();if(!em){$("#lerr").textContent="Avval emailni yozing";return}
    const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split("#")[0]});
    $("#lerr").style.color=error?"":"var(--ok)";$("#lerr").textContent=error?error.message:"Parolni tiklash havolasi emailingizga yuborildi"};
  if(signedIn)$("#lo").onclick=async()=>{await sb.auth.signOut();showLogin()};
}
function showReset(){
  $("#app").innerHTML=`<div class="login"><form class="card" id="rf"><h1>Yangi parol</h1><label class="f"><span>Yangi parol (kamida 10 belgi)</span><input type="password" id="rp" minlength="10" autocomplete="new-password" required></label><div class="err" id="rerr"></div><button class="btn">Saqlash</button></form></div>`;
  $("#rf").onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.updateUser({password:$("#rp").value});if(error){$("#rerr").textContent=error.message;return}history.replaceState(null,"",location.pathname);toast("Parol yangilandi");init()};
}

/* ================= shell ================= */
function shell(){
  $("#app").innerHTML=`<header class="top"><div class="wrap"><div class="logo">AYNIMO <small>ADMIN</small></div>
    <nav class="tabs"><button data-t="orders">Buyurtmalar<span class="badge" id="nb" hidden></span></button><button data-t="products">Mahsulotlar</button><button data-t="reviews">Izohlar<span class="badge" id="rb" hidden></span></button><button data-t="catalog">Bo'limlar</button><button data-t="settings">Sozlamalar</button>${isOwner?`<button data-t="team">Adminlar</button>`:""}</nav>
    <div class="me"><span>${esc(me.email)} · ${isOwner?"ega":"menejer"}</span><button class="btn ghost sm" id="out">Chiqish</button></div></div></header>
    <main class="wrap" id="main"></main><div class="ed" id="ed"><div class="sheet" id="sheet"></div></div>`;
  $(".tabs").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.t)};
  $("#out").onclick=async()=>{await sb.auth.signOut();location.reload()};
  $("#ed").onclick=e=>{if(e.target.id==="ed")closeEd()};
  addEventListener("keydown",e=>{if(e.key==="Escape")closeEd()});
  go(location.hash.slice(1)||"orders");
  setInterval(pollOrders,30000);pendingReviews();
}
function go(t){tab=["orders","products","reviews","catalog","settings"].concat(isOwner?["team"]:[]).includes(t)?t:"orders";history.replaceState(null,"","#"+tab);$$(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  ({orders:viewOrders,products:viewProducts,reviews:viewReviews,catalog:viewCatalog,settings:viewSettings,team:viewTeam})[tab]()}

/* ================= orders ================= */
let ofilter="active",oq="";
async function loadOrders(){const {data,error}=await sb.from("orders").select("*").order("created_at",{ascending:false}).limit(300);if(error)throw error;orders=data;
  const n=orders.filter(o=>o.status==="new").length;const b=$("#nb");if(b){b.hidden=!n;b.textContent=n}
  if(n>lastNew&&lastNew!==0){toast("Yangi buyurtma keldi!");try{new AudioContext().resume()}catch(e){}}lastNew=n||lastNew;return orders}
async function pollOrders(){try{await loadOrders();if(tab==="orders")drawOrders()}catch(e){}}
async function viewOrders(){$("#main").innerHTML=`<div class="head"><div><h1>Buyurtmalar</h1><p class="sub">Saytdan kelgan buyurtmalar. Narxlar serverda qayta hisoblangan.</p></div>
  <div class="tools"><input type="search" id="oq" placeholder="Raqam, ism yoki telefon" style="width:240px" value="${esc(oq)}"><select id="of" style="width:auto"><option value="active">Faol</option><option value="all">Hammasi</option>${Object.entries(STN).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><button class="btn ghost" id="orl">Yangilash</button></div></div>
  <div class="stats" id="ost"></div><div class="olist" id="ol"><div class="empty"><span class="spin"></span></div></div>`;

function drawOrders(){if(!$("#ol"))return;

    <div class="meta"><span>💳 <b>${PAYN[o.payment_method]||"Naqd"}</b></span><span class="pill p-${o.payment_status||"unpaid"}">${PSN[o.payment_status]||"To'lanmagan"}</span>
      ${o.receipt_url?`<a href="${esc(o.receipt_url)}" target="_blank" rel="noopener">🧾 Chekni ko'rish</a>`:""}</div>
    ${o.note?`<div class="note">💬 ${esc(o.note)}</div>`:""}
    <div class="items">${(o.items||[]).map(i=>`<div class="it"><img src="${esc(src(i.img))}" alt="" loading="lazy"><div><b>${esc(i.name)}</b> <span class="muted">${esc(i.sku||"")}</span><div class="q">${esc(i.color)} · ${esc(i.size)} · ${i.q} × ${fmt(i.price)}</div></div><b>${fmt(i.sum)}</b></div>`).join("")}</div>
    ${o.discount>0?`<div class="tot" style="font-weight:400;font-size:13px"><span class="muted">Chegirma</span><span class="muted">− ${fmt(o.discount)}</span></div>`:""}<div class="tot"><span>Jami</span><span>${fmt(o.total)}</span></div>${o.stock_reserved?`<div class="muted" style="font-size:12px">Ombordan ayirilgan. "Bekor qilindi" qilsangiz qaytadi.</div>`:""}
    <div class="acts"><select data-st>${Object.entries(STN).map(([k,v])=>`<option value="${k}" ${k===o.status?"selected":""}>${v}</option>`).join("")}</select>
      <select data-ps>${Object.entries(PSN).map(([k,v])=>`<option value="${k}" ${k===(o.payment_status||"unpaid")?"selected":""}>${v}</option>`).join("")}</select>
      <input type="text" data-an placeholder="Ichki izoh (mijoz ko'rmaydi)" value="${esc(o.admin_note||"")}" style="flex:1;min-width:180px"><button class="btn sm" data-save>Saqlash</button>
      <a class="btn ghost sm" href="https://t.me/+${esc(o.phone.replace(/\D/g,""))}" target="_blank" rel="noopener">Telegram</a></div></article>`).join(""):`<div class="card empty">Bu bo'limda buyurtma yo'q</div>`;
  $$("#ol [data-save]").forEach(b=>b.onclick=async()=>{const c=b.closest(".order"),id=+c.dataset.id;b.disabled=true;
    const ps=$("[data-ps]",c).value,prev=orders.find(x=>x.id===id);
    const patch={status:$("[data-st]",c).value,admin_note:$("[data-an]",c).value.trim()||null,payment_status:ps};
    if(ps==="paid"&&prev.payment_status!=="paid")patch.paid_at=new Date().toISOString();
    const {error}=await sb.from("orders").update(patch).eq("id",id);b.disabled=false;
    if(error)return fail(error,"Saqlanmadi");toast("Saqlandi");loadOrders().then(drawOrders)})}

let pcat="all",pq="";
async function loadProducts(){const {data,error}=await sb.from("products").select("*,variants(*,inventory(*)),product_collections(collection_id)").order("sort").order("id").order("sort",{referencedTable:"variants"});if(error)throw error;products=data;return data}
async function viewProducts(){$("#main").innerHTML=`<div class="head"><div><h1>Mahsulotlar</h1><p class="sub" id="pcount"></p></div>
  <div class="tools"><input type="search" id="pq" placeholder="Nomi yoki artikul" style="width:220px" value="${esc(pq)}"><select id="pc" style="width:auto"><option value="all">Barcha bo'limlar</option>${catOpts()}<option value="lowstock">⚠ Kam qolganlar</option></select><button class="btn" id="padd">+ Yangi mahsulot</button></div></div>

  try{await loadProducts();drawProducts()}catch(e){fail(e,"Mahsulotlar")}}
function drawProducts(){const q=pq.trim().toLowerCase();const list=products.filter(p=>(pcat==="all"||(pcat==="lowstock"?(p.track_stock&&stockOf(p)<=3):p.category===pcat))&&(!q||(p.name+" "+(p.sku||"")+" "+p.id).toLowerCase().includes(q)));
  $("#pcount").textContent=`${products.length} ta mahsulot · ${products.filter(p=>p.active).length} tasi saytda ko'rinadi`;
  $("#pg").innerHTML=list.length?list.map(p=>{const v=p.variants[0];return `<div class="card pc ${p.active?"":"off"}" data-id="${esc(p.id)}"><div class="ph">${v&&v.images[0]?`<img src="${esc(src(v.images[0]))}" alt="" loading="lazy">`:""}<span class="tag">${!p.active?`<span class="pill s-cancelled">Yashirin</span>`:p.badge==="new"?`<span class="pill s-confirmed">Yangi</span>`:p.badge==="sale"?`<span class="pill s-new">Aksiya</span>`:""}</span></div>
    <div class="in"><b>${esc(p.name)}</b><small>${esc(CATN[p.category]||p.category)} · ${esc(p.sku||p.id)}</small><span>${saleOn(p)?`<s class="muted">${fmt(p.price)}</s> <b style="color:var(--bad,#b4472f)">${fmt(p.sale_price)}</b>`:fmt(p.price)}</span>${p.track_stock?`<small class="${stockOf(p)?"":"bad"}">${stockOf(p)?"Omborda: "+stockOf(p)+" dona":"Tugagan"}</small>`:""}<div class="dots">${p.variants.map(v=>`<i style="background:${esc(v.hex)}" title="${esc(v.color)}"></i>`).join("")}</div></div></div>`}).join(""):`<div class="card empty" style="grid-column:1/-1">Hech narsa topilmadi</div>`;
  $$("#pg .pc").forEach(c=>c.onclick=()=>openEd(products.find(p=>p.id===c.dataset.id)))}

const saleOn=p=>p.sale_price!=null&&p.sale_price<p.price&&(!p.sale_ends_at||new Date(p.sale_ends_at)>new Date());
const stockOf=p=>p.variants.reduce((a,v)=>a+(v.inventory||[]).filter(r=>!p.sizes.length||p.sizes.includes(r.size)).reduce((b,r)=>b+r.qty,0),0);
const isoLocal=s=>{if(!s)return"";const d=new Date(s),z=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`};

/* resize + convert to WebP in the browser, then upload to Supabase Storage */
async function upload(file,max,trim){
  const bmp=await createImageBitmap(file);let sx=0,sy=0,sw=bmp.width,sh=bmp.height,hx=.5;
  if(trim){const c0=new OffscreenCanvas(bmp.width,bmp.height),x0=c0.getContext("2d");x0.drawImage(bmp,0,0);const d=x0.getImageData(0,0,bmp.width,bmp.height).data;
    let minX=bmp.width,minY=bmp.height,maxX=-1,maxY=-1;for(let y=0;y<bmp.height;y+=2)for(let x=0;x<bmp.width;x+=2){if(d[(y*bmp.width+x)*4+3]>24){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}}
    if(maxX<0)throw new Error("Rasm shaffof emas yoki bo'sh");if(minX===0&&minY===0&&maxX>=bmp.width-2&&maxY>=bmp.height-2)throw new Error("Rasm foni shaffof emas — fonsiz PNG yuklang");
    sx=minX;sy=minY;sw=maxX-minX+1;sh=maxY-minY+1;
    let tx=0,tn=0;const band=Math.max(2,Math.round(sh*.03));for(let y=sy;y<sy+band;y++)for(let x=sx;x<sx+sw;x++)if(d[(y*bmp.width+x)*4+3]>128){tx+=x;tn++}
    if(tn)hx=Math.round(((tx/tn-sx)/sw)*1000)/1000}
  const k=Math.min(1,max/Math.max(sw,sh)),w=Math.round(sw*k),h=Math.round(sh*k);
  const c=new OffscreenCanvas(w,h);const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(bmp,sx,sy,sw,sh,0,0,w,h);
  const blob=await c.convertToBlob({type:"image/webp",quality:.86});
  const pid=(($("#fid")&&$("#fid").value.trim())||"misc").replace(/[^A-Za-z0-9_-]/g,"");
  const path=`${pid}/${crypto.randomUUID()}.webp`;
  const {error}=await sb.storage.from("products").upload(path,blob,{contentType:"image/webp",cacheControl:"31536000",upsert:false});if(error)throw error;
  return {url:sb.storage.from("products").getPublicUrl(path).data.publicUrl,w,h,hx}}

    <label class="f"><span>Telefon</span><input type="tel" id="sp" value="${esc(settings.phone||"")}" placeholder="+998901234567"></label></div>
    <label class="f"><span>Sayt manzili</span><input type="text" id="surl" value="${esc(settings.site_url||"")}" placeholder="https://..."><small>To'lov va QR havolalari shu manzilga ishlaydi</small></label></section>

   <section class="card sec"><h3>To'lov usullari</h3>
    <p class="sub">Mijoz buyurtma berayotganda faqat yoqilgan usullarni ko'radi.</p>
    <div class="g2">
      <label class="switch"><input type="checkbox" id="pa1" ${PM.cash_pickup!==false?"checked":""}> Do'konda to'lash (olib ketish)</label>
      <label class="switch"><input type="checkbox" id="pa2" ${PM.cash_courier!==false?"checked":""}> Kuryerga naqd</label>
      <label class="switch"><input type="checkbox" id="pa3" ${PM.card_courier?"checked":""}> Kuryerga karta (terminal)</label>
      <label class="switch"><input type="checkbox" id="pa4" ${PM.transfer?"checked":""}> Kartaga o'tkazish</label>
    </div>
    <div class="g2"><label class="f"><span>Karta raqami</span><input type="text" id="pcard" value="${esc(PM.transfer_card||"")}" placeholder="8600 1234 5678 9012"></label>
     <label class="f"><span>Karta egasi</span><input type="text" id="pname" value="${esc(PM.transfer_name||"")}" placeholder="AYNIMO MCHJ"></label></div>
    <div class="hint">Kartaga o'tkazishda mijoz chek rasmini yuboradi, buyurtma "Chek tekshirilmoqda" bo'lib turadi. Siz pul kelganini ko'rib, "To'langan" qilib qo'yasiz.</div>
   </section>

   <section class="card sec"><h3>Onlayn to'lov</h3>
    <p class="sub">Bular uchun tegishli kompaniya bilan shartnoma va kassa kerak. Ma'lumotlarni kiritmaguningizcha usul mijozga ko'rinmaydi.</p>
    <label class="switch"><input type="checkbox" id="pm1" ${PM.payme?"checked":""}> Payme</label>
    <label class="f"><span>Payme merchant ID (kassa)</span><input type="text" id="pmid" value="${esc(PM.payme_merchant||"")}" placeholder="5f3e0c..."></label>
    <label class="switch"><input type="checkbox" id="pc1" ${PM.click?"checked":""}> Click</label>
    <div class="g2"><label class="f"><span>Click service_id</span><input type="text" id="pcs" value="${esc(PM.click_service||"")}"></label>
     <label class="f"><span>Click merchant_id</span><input type="text" id="pcm" value="${esc(PM.click_merchant||"")}"></label></div>
    <label class="switch"><input type="checkbox" id="pu1" ${PM.uzum?"checked":""}> Uzum</label>
    <label class="f"><span>Uzum to'lov havolasi</span><input type="text" id="puu" value="${esc(PM.uzum_url||"")}" placeholder="https://...?order={order}&amount={amount}"><small>Uzum bergan havolani qo'ying. {order} va {amount} o'rniga buyurtma raqami va summa qo'yiladi.</small></label>
    <div class="hint">To'lov kelgani avtomatik tekshirilmaydi — buyurtmani "To'langan" deb siz belgilaysiz. Avtomatik tasdiqlash uchun keyinchalik webhook ulash kerak.</div>
   </section>

   <section class="card sec"><h3>Izohlar</h3>
    <label class="switch"><input type="checkbox" id="sre" ${settings.reviews_on!==false?"checked":""}> Mijozlar izoh va rasm yubora olsin</label>
    <div class="hint">Har bir izoh avval "Izohlar" bo'limiga tushadi. Siz ko'rib chiqib, saytga chiqarasiz.</div></section>

   <section class="card sec"><h3>AI kiyib ko'rish</h3>
    <label class="f"><span>Usul</span><select id="stm">
      <option value="widget" ${(settings.tryon_mode||"widget")==="widget"?"selected":""}>AnyWear vidjeti (Decart hisobi orqali)</option>
      <option value="builtin" ${settings.tryon_mode==="builtin"?"selected":""}>Ichki — Decart API kaliti bilan</option>
      <option value="off" ${settings.tryon_mode==="off"?"selected":""}>O'chirilgan</option></select>
      <small>Vidjet: AnyWear'dagi hisobingiz orqali ishlaydi va hisob-kitob o'sha yerda. Ichki: do'kon ekrani (kiosk) va sayt ichidagi o'z oynamiz ishlaydi, Supabase'da DECART_API_KEY kerak.</small></label>
    <label class="switch"><input type="checkbox" id="ste" ${settings.tryon_enabled!==false?"checked":""}> Yoqilgan</label>
    <div class="g3"><label class="f"><span>Bir sessiya (soniya)</span><input type="number" id="sl1" value="${L.max_seconds||90}" min="20" max="300"></label>
     <label class="f"><span>Bir kishiga soatiga</span><input type="number" id="sl2" value="${L.per_ip_hour||4}" min="1" max="30"></label>
     <label class="f"><span>Kuniga jami</span><input type="number" id="sl3" value="${L.per_day||60}" min="1" max="2000"></label></div>
    <div class="hint">Yuqoridagi uchta cheklov faqat "Ichki" usulda ishlaydi. Oxirgi 24 soatda: <b>${cnt.count??0}</b> ta sessiya. Narx: Decart'da 1 daqiqa ≈ $1.20. Kunlik eng ko'p xarajat ≈ <b id="scost"></b>.</div></section>
   <div>${isOwner?`<button class="btn" id="ss">Saqlash</button>`:`<button class="btn" id="ss" disabled title="Faqat ega">Saqlash (faqat ega)</button>`}</div></div>`;
  const cost=()=>{$("#scost").textContent="$"+((+$("#sl1").value||0)/60*1.2*(+$("#sl3").value||0)).toFixed(0)};cost();["sl1","sl3"].forEach(i=>$("#"+i).oninput=cost);
  $("#ss").onclick=async()=>{const ph=$("#sp").value.replace(/[^\d+]/g,"");if(ph&&!/^\+998\d{9}$/.test(ph))return toast("Telefon +998XXXXXXXXX ko'rinishida bo'lsin",true);
    const card=$("#pcard").value.trim();
    if($("#pa4").checked&&card.replace(/\D/g,"").length<16)return toast("Kartaga o'tkazish uchun karta raqamini to'liq yozing",true);
    if($("#pm1").checked&&!$("#pmid").value.trim())return toast("Payme uchun merchant ID kerak",true);
    if($("#pc1").checked&&!($("#pcs").value.trim()&&$("#pcm").value.trim()))return toast("Click uchun service_id va merchant_id kerak",true);
    const url=$("#surl").value.trim().replace(/\/$/,"");
    if(url&&!/^https:\/\/[^\s]+$/.test(url))return toast("Sayt manzili https:// bilan boshlansin",true);
    const rows=[{key:"operator",value:$("#so").value.trim().replace(/^@/,"")},{key:"phone",value:ph},{key:"tryon_enabled",value:$("#ste").checked},
      {key:"tryon_mode",value:$("#stm").value},{key:"reviews_on",value:$("#sre").checked},{key:"site_url",value:url},
      {key:"payments",value:{cash_pickup:$("#pa1").checked,cash_courier:$("#pa2").checked,card_courier:$("#pa3").checked,
        transfer:$("#pa4").checked,transfer_card:card,transfer_name:$("#pname").value.trim(),
        payme:$("#pm1").checked,payme_merchant:$("#pmid").value.trim(),
        click:$("#pc1").checked,click_service:$("#pcs").value.trim(),click_merchant:$("#pcm").value.trim(),
        uzum:$("#pu1").checked,uzum_url:$("#puu").value.trim()}},
      {key:"tryon_limits",value:{max_seconds:+$("#sl1").value||90,per_ip_hour:+$("#sl2").value||4,per_day:+$("#sl3").value||60}}];
    const {error}=await sb.from("settings").upsert(rows);if(error)return fail(error,"Saqlanmadi");toast("Saqlandi")}}

init().catch(e=>{fail(e);showLogin()});
})();
</script>
</body>
</html>
